apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orghub.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orghub.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Direct connection. Used by the migrate initContainer, which needs a session-level
  # advisory lock and so cannot go through a transaction pooler.
  database-url: {{ include "orghub.databaseUrl" . | quote }}
  # What the app pods use: PgBouncer when enabled, otherwise the direct URL.
  database-url-pooled: {{ include "orghub.databaseUrlPooled" . | quote }}
  auth-secret: {{ required "app.authSecret is required" .Values.app.authSecret | quote }}
  postgres-password: {{ required "postgres.password is required" .Values.postgres.password | quote }}
