apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orghub.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orghub.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: orghub
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "orghub.labels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      initContainers:
        - name: migrate
          image: {{ include "orghub.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node_modules/.bin/prisma", "migrate", "deploy"]
          env:
            # Direct, not pooled: `migrate deploy` takes a session-level advisory lock and
            # needs the same backend for the whole run, which transaction pooling cannot
            # promise.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "orghub.name" . }}
                  key: database-url
      containers:
        - name: orghub
          image: {{ include "orghub.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "orghub.name" . }}
                  key: database-url-pooled
            - name: DB_POOL_MAX
              value: {{ .Values.dbPoolMax | quote }}
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "orghub.name" . }}
                  key: auth-secret
            - name: AUTH_TRUST_HOST
              value: "true"
            {{- if .Values.app.baseUrl }}
            - name: AUTH_URL
              value: {{ .Values.app.baseUrl | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
