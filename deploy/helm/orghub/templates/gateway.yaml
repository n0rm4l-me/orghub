{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "orghub.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orghub.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClass }}
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
