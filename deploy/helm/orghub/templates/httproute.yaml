{{- $useShared := and (not .Values.gateway.enabled) .Values.gateway.parentName }}
{{- if or .Values.gateway.enabled $useShared }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "orghub.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orghub.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- if $useShared }}
    - name: {{ .Values.gateway.parentName }}
      namespace: {{ .Values.gateway.parentNamespace }}
      {{- if .Values.gateway.parentSectionName }}
      sectionName: {{ .Values.gateway.parentSectionName }}
      {{- end }}
    {{- else }}
    - name: {{ include "orghub.name" . }}
      namespace: {{ .Release.Namespace }}
    {{- end }}
  {{- if .Values.gateway.hostname }}
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ include "orghub.name" . }}
          port: 80
{{- end }}
