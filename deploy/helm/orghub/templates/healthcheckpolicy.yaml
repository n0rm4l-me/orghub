{{- if or .Values.gateway.enabled (and (not .Values.gateway.enabled) .Values.gateway.parentName) }}
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: {{ include "orghub.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orghub.labels" . | nindent 4 }}
spec:
  default:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 2
    logConfig:
      enabled: false
    config:
      type: HTTP
      httpHealthCheck:
        port: 3000
        requestPath: /api/health/live
  targetRef:
    group: ""
    kind: Service
    name: {{ include "orghub.name" . }}
{{- end }}
