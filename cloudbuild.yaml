steps:
  # Build migrator stage
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target=migrator
      - -t
      - $_IMAGE:$_TAG-migrator
      - .

  # Build runner stage (reuses layers cached from migrator build above)
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - $_IMAGE:$_TAG
      - .

images:
  - $_IMAGE:$_TAG-migrator
  - $_IMAGE:$_TAG

substitutions:
  _IMAGE: REPLACE_WITH_YOUR_REGISTRY_PATH/orghub
  _TAG: dev
